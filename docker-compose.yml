services:
  securewipe:
    build: .
    container_name: securewipe
    user: "0:0"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
    volumes:
      - .:/app
      - /run/udev:/run/udev:ro
      - /dev/disk:/dev/disk
    working_dir: /app
    stdin_open: true
    tty: true
    command: /bin/bash